name: Balcão Seguro — Build Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  CI: true
  EXPO_NO_TELEMETRY: 1
  NPM_CONFIG_LEGACY_PEER_DEPS: true
  APP_VERSION: 1.3.1

jobs:
  build-android:
    name: Gerar APK + AAB Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verificar ambiente
        run: |
          node --version
          npm --version
          java -version

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps --no-audit --fund=false

      - name: TypeScript
        run: npm run typecheck

      - name: Validar base de medicamentos
        run: |
          python3 scripts/validar_base_medicamentos.py
          python3 scripts/validar_base_enriquecida.py

      - name: Gerar projeto Android com Expo
        run: |
          npx expo prebuild \
            --platform android \
            --clean \
            --non-interactive \
            --no-install

      - name: Preparar Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Criar assinatura de CI
        working-directory: android
        run: |
          mkdir -p signing

          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore signing/balcao-seguro-ci.keystore \
            -alias balcao_seguro_ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'BalcaoSeguroCI2026' }}" \
            -keypass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'BalcaoSeguroCI2026' }}" \
            -dname "CN=Balcao Seguro, O=Balcao Seguro, C=BR"

          cat > balcao-seguro-keystore.properties <<EOF
          storeFile=../signing/balcao-seguro-ci.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'BalcaoSeguroCI2026' }}
          keyAlias=balcao_seguro_ci
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'BalcaoSeguroCI2026' }}
          EOF

      - name: Aplicar configuração de assinatura
        run: |
          if [ -f scripts/patch_android_signing.py ]; then
            python3 scripts/patch_android_signing.py
          fi

      - name: Compilar APK Release
        working-directory: android
        run: ./gradlew clean assembleRelease --stacktrace --no-daemon

      - name: Compilar AAB Release
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Validar APK sem Metro
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK"

          echo "APK: $APK"

          if [ -f scripts/validar_apk_sem_servidor.py ]; then
            python3 scripts/validar_apk_sem_servidor.py "$APK"
          fi

      - name: Preparar artefatos
        run: |
          mkdir -p dist

          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          cp "$APK" "dist/Balcao-Seguro-v${APP_VERSION}-release.apk"
          cp "$AAB" "dist/Balcao-Seguro-v${APP_VERSION}-playstore.aab"

          ls -lh dist

      - name: Publicar APK e AAB
        uses: actions/upload-artifact@v4
        with:
          name: Balcao-Seguro-v${{ env.APP_VERSION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Guardar logs em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Balcao-Seguro-build-logs
          path: |
            android/app/build/outputs/**
            android/**/*.log
          if-no-files-found: ignore
